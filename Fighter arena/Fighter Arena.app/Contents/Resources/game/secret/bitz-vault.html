<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitz Vault</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(54, 93, 132, 0.32), transparent 38%),
          linear-gradient(180deg, #08111d 0%, #03070d 100%);
        color: #f3f8ff;
      }

      .shell {
        width: min(920px, calc(100vw - 32px));
        display: grid;
        gap: 14px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
      }

      .eyebrow {
        margin: 0 0 6px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #87cfff;
        font-size: 0.72rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.2rem);
      }

      .summary,
      .scoreline {
        margin: 0;
        color: rgba(232, 242, 255, 0.78);
      }

      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        border: 1px solid rgba(138, 205, 255, 0.2);
        background:
          linear-gradient(180deg, rgba(16, 31, 48, 0.96), rgba(5, 11, 20, 0.98));
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.34);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .hint {
        color: rgba(232, 242, 255, 0.76);
      }

      button {
        border: 1px solid rgba(138, 205, 255, 0.26);
        background: rgba(12, 30, 48, 0.92);
        color: #f4f9ff;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: rgba(24, 49, 76, 0.96);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div>
          <p class="eyebrow">Hidden Mini Game</p>
          <h1>Bitz Vault</h1>
          <p class="summary">Slide through the vault, catch Bitz, and avoid security pulses.</p>
        </div>
        <p class="scoreline" id="scoreline">Score 0 · Best 0</p>
      </div>
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="controls">
        <p class="hint">Move with <strong>A / D</strong> or <strong>Left / Right</strong>. Press <strong>Space</strong> to dash.</p>
        <button id="restart" type="button">Restart Run</button>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreline = document.getElementById("scoreline");
      const restartButton = document.getElementById("restart");

      const input = { left: false, right: false, dash: false };
      const keys = {
        ArrowLeft: "left",
        KeyA: "left",
        ArrowRight: "right",
        KeyD: "right",
        Space: "dash",
      };

      let state;
      const bestScore = { value: Number(localStorage.getItem("bitzVault.best") || 0) || 0 };

      function resetGame() {
        state = {
          time: 0,
          score: 0,
          ended: false,
          player: { x: canvas.width / 2, y: canvas.height - 92, width: 96, height: 24, vx: 0, dashCd: 0 },
          bitz: [],
          pulses: [],
          spawnBitzAt: 0.4,
          spawnPulseAt: 1.2,
        };
        updateScoreline();
      }

      function updateScoreline() {
        scoreline.textContent = "Score " + state.score + " · Best " + bestScore.value;
      }

      function spawnBitz() {
        state.bitz.push({
          x: 80 + Math.random() * (canvas.width - 160),
          y: -20,
          r: 11 + Math.random() * 6,
          speed: 170 + Math.random() * 80,
          wobble: Math.random() * Math.PI * 2,
        });
      }

      function spawnPulse() {
        const width = 150 + Math.random() * 280;
        state.pulses.push({
          x: Math.random() * (canvas.width - width),
          y: -30,
          width,
          height: 24,
          speed: 230 + Math.random() * 90,
        });
      }

      function endGame() {
        state.ended = true;
        if (state.score > bestScore.value) {
          bestScore.value = state.score;
          localStorage.setItem("bitzVault.best", String(bestScore.value));
        }
        updateScoreline();
      }

      function intersects(a, b) {
        return !(
          a.x + a.width * 0.5 < b.x ||
          a.x - a.width * 0.5 > b.x + b.width ||
          a.y + a.height * 0.5 < b.y ||
          a.y - a.height * 0.5 > b.y + b.height
        );
      }

      function update(dt) {
        if (state.ended) {
          return;
        }

        state.time += dt;
        const p = state.player;
        const accel = 1800;
        const drag = 0.88;
        const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        p.vx += dir * accel * dt;
        p.vx *= drag;
        if (input.dash && p.dashCd <= 0) {
          p.vx += (dir === 0 ? 1 : dir) * 520;
          p.dashCd = 0.9;
        }
        p.dashCd = Math.max(0, p.dashCd - dt);
        p.x = Math.max(p.width * 0.5, Math.min(canvas.width - p.width * 0.5, p.x + p.vx * dt));

        if (state.time >= state.spawnBitzAt) {
          spawnBitz();
          state.spawnBitzAt = state.time + Math.max(0.28, 0.7 - state.score * 0.012);
        }
        if (state.time >= state.spawnPulseAt) {
          spawnPulse();
          state.spawnPulseAt = state.time + Math.max(0.55, 1.3 - state.score * 0.018);
        }

        for (let i = state.bitz.length - 1; i >= 0; i -= 1) {
          const bit = state.bitz[i];
          bit.y += bit.speed * dt;
          bit.x += Math.sin(state.time * 3 + bit.wobble) * 40 * dt;
          if (
            Math.abs(bit.x - p.x) < bit.r + p.width * 0.45 &&
            Math.abs(bit.y - p.y) < bit.r + p.height * 0.5
          ) {
            state.score += 1;
            state.bitz.splice(i, 1);
            updateScoreline();
            continue;
          }
          if (bit.y - bit.r > canvas.height) {
            state.bitz.splice(i, 1);
          }
        }

        for (let i = state.pulses.length - 1; i >= 0; i -= 1) {
          const pulse = state.pulses[i];
          pulse.y += pulse.speed * dt;
          if (intersects(p, pulse)) {
            endGame();
            return;
          }
          if (pulse.y > canvas.height + 40) {
            state.pulses.splice(i, 1);
          }
        }
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#13253a");
        grad.addColorStop(1, "#040a12");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(112, 192, 255, 0.08)";
        ctx.lineWidth = 1;
        for (let y = 40; y < canvas.height; y += 38) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function draw() {
        drawBackground();

        ctx.fillStyle = "rgba(93, 181, 255, 0.14)";
        ctx.fillRect(0, canvas.height - 140, canvas.width, 140);

        for (const bit of state.bitz) {
          ctx.beginPath();
          ctx.fillStyle = "#84f5c9";
          ctx.arc(bit.x, bit.y, bit.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.34)";
          ctx.fillRect(bit.x - 2, bit.y - bit.r * 0.6, 4, bit.r * 1.2);
          ctx.fillRect(bit.x - bit.r * 0.6, bit.y - 2, bit.r * 1.2, 4);
        }

        for (const pulse of state.pulses) {
          ctx.fillStyle = "#ff6d7a";
          ctx.fillRect(pulse.x, pulse.y, pulse.width, pulse.height);
        }

        const p = state.player;
        ctx.fillStyle = "#c7ecff";
        ctx.fillRect(p.x - p.width * 0.5, p.y - p.height * 0.5, p.width, p.height);
        ctx.fillStyle = "#64c5ff";
        ctx.fillRect(p.x - 18, p.y - 22, 36, 12);

        if (state.ended) {
          ctx.fillStyle = "rgba(3, 9, 17, 0.72)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#f4f9ff";
          ctx.textAlign = "center";
          ctx.font = "700 58px Inter, sans-serif";
          ctx.fillText("Vault Closed", canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = "400 26px Inter, sans-serif";
          ctx.fillText("Score " + state.score + " · Press Restart to run again", canvas.width / 2, canvas.height / 2 + 38);
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        const key = keys[event.code];
        if (!key) {
          return;
        }
        event.preventDefault();
        input[key] = true;
      });
      window.addEventListener("keyup", (event) => {
        const key = keys[event.code];
        if (!key) {
          return;
        }
        event.preventDefault();
        input[key] = false;
      });
      restartButton.addEventListener("click", resetGame);

      resetGame();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
